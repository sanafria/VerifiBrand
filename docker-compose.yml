services:
  # ==============================================================================
  # 1. PostgreSQL 16 Relational Database
  # ==============================================================================
  brandledger_db:
    image: postgres:16-alpine
    container_name: brandledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brandledger
      POSTGRES_USER: brandledger_user
      POSTGRES_PASSWORD: brandledger_secret
    ports:
      # Port 5433 mapped to container 5432 to avoid collision with other local databases
      - "5433:5432"
    volumes:
      - brandledger_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandledger_user -d brandledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. BrandLedger FastAPI Backend & Rules Engine
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brandledger_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Uses Docker internal bridge DNS (brandledger_db:5432)
      - DATABASE_URL=postgresql://brandledger_user:brandledger_secret@brandledger_db:5432/brandledger
      - BRANDLEDGER_DISABLE_AI=false
      - BRANDLEDGER_LLM_API_KEY=pt_live_95e90d1c51b2a2ad937e4be7c6cd227c33c8a4ff
      - OPENAI_API_KEY=pt_live_95e90d1c51b2a2ad937e4be7c6cd227c33c8a4ff
      - BRANDLEDGER_LLM_BASE_URL=https://api.openai.com/v1
      - BRANDLEDGER_LLM_MODEL=gpt-4o-mini
      - BL_OCR_LANG=eng
      - BL_MAX_FILE_MB=20
      - BL_MAX_PDF_PAGES=15
    depends_on:
      brandledger_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==============================================================================
  # 3. Next.js 16 Web Application Frontend
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_USE_BACKEND_CRUD=false
        - NEXT_PUBLIC_ADAPTIONLABS_API_KEY=pt_live_95e90d1c51b2a2ad937e4be7c6cd227c33c8a4ff
    container_name: brandledger_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_USE_BACKEND_CRUD=false
      - NEXT_PUBLIC_ADAPTIONLABS_API_KEY=pt_live_95e90d1c51b2a2ad937e4be7c6cd227c33c8a4ff
    depends_on:
      backend:
        condition: service_healthy

volumes:
  brandledger_pgdata:
