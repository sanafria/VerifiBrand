name: VerifiBrand CI/CD Validation Pipeline

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Automated Test Suite (FastAPI Backend, PostgreSQL, Fetch.ai Agent & E2E)
  # ============================================================================
  test-suite:
    name: "Python ${{ matrix.python-version }} | Backend, Agent & E2E"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brandledger
          POSTGRES_USER: brandledger_user
          POSTGRES_PASSWORD: brandledger_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brandledger_user -d brandledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (OCR & PostgreSQL client)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            postgresql-client \
            curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent/requirements.txt

      - name: Initialize PostgreSQL database schema & seed data
        env:
          PGPASSWORD: brandledger_secret
        run: |
          echo "Applying database/schema.sql..."
          psql -h 127.0.0.1 -p 5433 -U brandledger_user -d brandledger -f database/schema.sql
          echo "Applying database/seed.sql..."
          psql -h 127.0.0.1 -p 5433 -U brandledger_user -d brandledger -f database/seed.sql

      - name: Run Backend, Gate, Agent & End-to-End Tests
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql://brandledger_user:brandledger_secret@127.0.0.1:5433/brandledger
          CMS_WEBHOOK_SECRET: ci_test_webhook_secret_32_characters_long_min
          AGENT_SEED: test-agent-seed-continuous-integration-safe-mnemonic
          AGENT_PORT: 8001
          BACKEND_URL: http://127.0.0.1:8000
          BRANDLEDGER_DISABLE_AI: "true"
        run: |
          python -m pytest backend/tests -v --durations=10

      - name: Run Publication Gate GitHub Action Runner Tests
        run: |
          python3 .github/actions/publication-gate/test_runner.py -v

  # ============================================================================
  # 2. Security & Container Readiness Checks
  # ============================================================================
  security-and-docker:
    name: "Security, Secrets & Container Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Verify .env and sensitive credential files are untracked
        run: |
          echo "Verifying no local secret files are tracked in git..."
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: Root .env is tracked in git!"
            exit 1
          fi
          if git ls-files --error-unmatch agent/.env 2>/dev/null; then
            echo "ERROR: agent/.env is tracked in git!"
            exit 1
          fi
          echo "SUCCESS: Secret environment files are cleanly ignored."

      - name: Validate .env.example contains placeholders only
        run: |
          echo "Checking .env.example files for exposed production secrets..."
          if grep -iE "pt_live_|sk-[a-zA-Z0-9]{20,}" .env.example; then
            echo "ERROR: Real API credentials detected in .env.example!"
            exit 1
          fi
          echo "SUCCESS: .env.example contains safe placeholders."

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating docker-compose.yml syntax and service definitions..."
          docker compose config --quiet
          echo "SUCCESS: Docker Compose configuration is valid."
